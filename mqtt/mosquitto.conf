# SmartFactory 4.0 - Mosquitto MQTT Broker Configuration
# Port for MQTT traffic
listener 1883 0.0.0.0

# Allow anonymous connections for local development/demonstrations
allow_anonymous true

# Persistence
persistence true
persistence_location ./mqtt/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
